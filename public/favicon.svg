<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#598BF5" />
      <stop offset="100%" stopColor="#9B7CF7" />
    </linearGradient>
    <linearGradient id="inTuneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34C78B" />
      <stop offset="100%" stopColor="#1DB88E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#598BF5" floodOpacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Guitar Headstock Contour -->
  <path d="M 24 46 C 22 36, 20 28, 22 20 C 24 16, 28 14, 32 16 C 36 14, 40 16, 42 20 C 44 28, 42 36, 40 46 Z" 
        fill="#FFFFFF" opacity="0.95" filter="url(#glow)" />

  <!-- Tuning Pegs Left & Right -->
  <circle cx="16" cy="22" r="3.5" fill="#FFFFFF" />
  <circle cx="16" cy="32" r="3.5" fill="#FFFFFF" />
  <circle cx="48" cy="22" r="3.5" fill="#FFFFFF" />
  <circle cx="48" cy="32" r="3.5" fill="#FFFFFF" />

  <!-- Center In-Tune Indicator Pip -->
  <circle cx="32" cy="26" r="4.5" fill="url(#inTuneGrad)" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Harmonic Tuning Waves -->
  <path d="M 26 10 C 29 8, 35 8, 38 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 22 6 C 28 3, 36 3, 42 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>